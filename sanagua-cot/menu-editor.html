<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="assets/images/icon/icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Editor de Menú — Sanagua Lodge</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <link rel="stylesheet" href="../assets/css/menu-editor.css?v=3">
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <button class="cat-hamburger" id="cat-hamburger-btn" onclick="toggleCatDrawer()" aria-label="Categorías">
      <span></span><span></span><span></span>
    </button>
    <span class="header-logo"><i class="fa-solid fa-leaf"></i> Sanagua Lodge S.A.</span>
  </div>
  <div class="header-right">
    <button class="btn-save-all" onclick="saveAll()" id="btn-save-all">
      <i class="fa-solid fa-floppy-disk"></i> Guardar todo
    </button>
  </div>
</header>

<div class="cat-drawer-overlay" id="cat-drawer-overlay" onclick="closeCatDrawer()"></div>

<div class="layout">

  <!-- Drawer de categorías (oculto hasta abrir con la hamburguesa) -->
  <aside class="sidebar" id="cat-drawer">
    <div class="sidebar-label" style="font-size:.8rem;letter-spacing:.02em;text-transform:none;color:#fff;font-weight:700;padding:16px 16px 10px">
      <i class="fa-solid fa-utensils"></i> Editor de Menú
    </div>
    <div class="sidebar-label">Categorías</div>
    <div id="sidebar-cats"></div>
    <button class="cat-btn" onclick="location.href='achive.html'" style="margin-top:8px;border-top:1px solid rgba(255,255,255,.1)">
      <span class="cat-icon"><i class="fa-solid fa-arrow-left"></i></span>
      <span>Volver</span>
    </button>
  </aside>

  <!-- Panel principal -->
  <main class="main" id="main-content">
    <div class="empty-cat">
      <div class="empty-icon"><i class="fa-solid fa-utensils"></i></div>
      <p>Cargando menú...</p>
    </div>
  </main>

</div>

<!-- Toast y loading -->
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
  // ── Supabase (datos del menú: categorías y platos) ───────────────────
  const SUPABASE_URL      = 'https://cjgdlskybcaacbpnncuw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqZ2Rsc2t5YmNhYWNicG5uY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTAwNjMsImV4cCI6MjEwMDM4NjA2M30.6UVRJBUxmLBo1ffTd7tZtfLald6Sm0qTmWi5Tx4HH98';
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // URL del backend Flask (app.py) en el VPS. Ahí se suben y sirven las
  // fotos del menú (ver /upload-image en app.py). Cambia este valor por el
  // dominio real cuando despliegues (el mismo que en achive.html y
  // assets/js/admin-guard.js).
  const API_BASE = 'http://localhost:5000';


  // ── Verificar sesión ────────────────────────────────────────────────
  // La verificación real ahora la hace assets/js/admin-guard.js (Supabase
  // Auth + confirmación server-side), cargado en <head>. Si no hay sesión
  // de admin/superadmin válida, ya redirigió antes de llegar aquí.

  // ── Estado ──────────────────────────────────────────────────────────
  let menuData  = null;
  let menuSha   = null;
  let catActual = 0;

  // ── Toast ───────────────────────────────────────────────────────────
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = 'toast', 3000);
  }

  function setLoading(v) {
    document.getElementById('loading').classList.toggle('show', v);
  }

  // ── Menú — Supabase (tablas restaurant_categories / restaurant_products) ─
  async function sbLoadMenu() {
    const [{ data: cats, error: e1 }, { data: prods, error: e2 }] = await Promise.all([
      supa.from('restaurant_categories').select('*').order('orden', { ascending: true }),
      supa.from('restaurant_products').select('*').order('orden', { ascending: true }),
    ]);
    if (e1) throw e1;
    if (e2) throw e2;
    return {
      categorias: (cats || []).map(c => ({
        id: c.id,               // uuid real de Supabase
        key: c.key || c.id,
        icon: c.icon || '<i class="fa-solid fa-utensils"></i>',
        label: c.nombre,
        subtitulo: c.subtitulo || '',
        platos: (prods || [])
          .filter(p => p.categoria_id === c.id)
          .map(p => ({ id: p.id, nombre: p.nombre, descripcion: p.descripcion || '', precio: parseFloat(p.precio) || 0, foto: p.foto || '' })),
      })),
    };
  }

  // Guarda todo: sincroniza categorías (upsert) y reemplaza sus platos.
  // Es el equivalente a sobrescribir menu.json completo.
  async function sbSaveMenu(data) {
    for (const cat of data.categorias) {
      // Upsert de la categoría (conserva su id si ya existe en Supabase)
      const catRow = { nombre: cat.label, subtitulo: cat.subtitulo, icon: cat.icon, orden: 0 };
      let categoriaId = cat.id;
      if (typeof categoriaId === 'string' && categoriaId.length < 36) {
        // id "nuevo" generado en el navegador (no es un uuid real todavía)
        const { data: inserted, error } = await supa.from('restaurant_categories').insert(catRow).select().single();
        if (error) throw error;
        categoriaId = inserted.id;
        cat.id = categoriaId;
      } else {
        const { error } = await supa.from('restaurant_categories').update(catRow).eq('id', categoriaId);
        if (error) throw error;
      }

      // Reemplaza los platos de esta categoría (borra y vuelve a insertar,
      // igual que antes se sobrescribía el arreglo completo en el JSON)
      const { error: delErr } = await supa.from('restaurant_products').delete().eq('categoria_id', categoriaId);
      if (delErr) throw delErr;
      if (cat.platos.length) {
        const rows = cat.platos.map((p, i) => ({
          categoria_id: categoriaId,
          nombre: p.nombre,
          descripcion: p.descripcion,
          precio: p.precio,
          foto: p.foto,
          orden: i,
        }));
        const { data: insertedProds, error: insErr } = await supa.from('restaurant_products').insert(rows).select();
        if (insErr) throw insErr;
        cat.platos = insertedProds.map(p => ({ id: p.id, nombre: p.nombre, descripcion: p.descripcion || '', precio: parseFloat(p.precio) || 0, foto: p.foto || '' }));
      }
    }
  }

  // ── Init ────────────────────────────────────────────────────────────
  async function init() {
    setLoading(true);
    try {
      menuData = await sbLoadMenu();
    } catch (e) {
      console.error(e);
      setLoading(false);
      showToast('❌ No se pudo cargar el menú desde Supabase. Revisa la consola.', 'error');
      return;
    }
    setLoading(false);
    if (!menuData.categorias.length) {
      document.getElementById('main-content').innerHTML = `
        <div class="empty-cat">
          <div class="empty-icon"><i class="fa-solid fa-utensils"></i></div>
          <p>Aún no hay categorías en Supabase. Corre el script de semilla del menú o crea una desde aquí.</p>
        </div>`;
    }
    renderSidebar();
    renderCategoria(0);
  }

  // ── Sidebar ─────────────────────────────────────────────────────────
  function renderSidebar() {
    document.getElementById('sidebar-cats').innerHTML =
      menuData.categorias.map((cat, i) => `
        <button class="cat-btn ${i===catActual?'active':''}" onclick="renderCategoria(${i});closeCatDrawer()">
          <span class="cat-icon">${cat.icon}</span>
          <span>${cat.label}</span>
          <span class="cat-count">${cat.platos.length}</span>
        </button>`).join('');
  }

  function toggleCatDrawer() {
    document.getElementById('cat-drawer').classList.toggle('open');
    document.getElementById('cat-drawer-overlay').classList.toggle('open');
  }
  function closeCatDrawer() {
    document.getElementById('cat-drawer').classList.remove('open');
    document.getElementById('cat-drawer-overlay').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCatDrawer(); });

  // ── Renderizar categoría ────────────────────────────────────────────
  function renderCategoria(idx) {
    catActual = idx;
    renderSidebar();
    const cat = menuData.categorias[idx];
    document.getElementById('main-content').innerHTML = `
      <div class="cat-header">
        <div class="cat-header-left">
          <div class="cat-icon-big">${cat.icon}</div>
          <div>
            <div class="cat-name">${cat.label}</div>
            <div class="cat-sub">${cat.subtitulo} · ${cat.platos.length} plato${cat.platos.length===1?'':'s'}</div>
          </div>
        </div>
        <button class="btn-add" onclick="addPlato(${idx})">+ Añadir plato</button>
      </div>
      <div class="platos-grid" id="platos-grid-${idx}">
        ${cat.platos.length === 0
          ? `<div class="empty-cat" style="grid-column:1/-1"><div class="empty-icon"><i class="fa-solid fa-utensils"></i></div><p>No hay platos aún.</p></div>`
          : cat.platos.map((p, pi) => renderPlatoCard(idx, pi, p)).join('')
        }
      </div>`;
  }

  // ── Card de plato ────────────────────────────────────────────────────
  function renderPlatoCard(catIdx, platoIdx, plato) {
    const id = `p-${catIdx}-${platoIdx}`;
    const fotoSrc = plato.foto || '';
    return `
      <div class="plato-card" id="card-${id}">
        <!-- Imagen -->
        <div class="plato-img-wrap" onclick="document.getElementById('img-input-${id}').click()">
          ${fotoSrc
            ? `<img id="img-preview-${id}" src="${fotoSrc}" alt="${plato.nombre}">`
            : `<div class="plato-img-placeholder" id="img-preview-${id}">
                <span><i class="fa-solid fa-utensils"></i></span><small>Subir foto</small>
               </div>`
          }
          <div class="plato-img-overlay"><span><i class="fa-solid fa-camera"></i> Cambiar foto</span></div>
          <input type="file" class="plato-img-input" id="img-input-${id}" accept="image/*"
            onchange="handleFoto(event,'${id}',${catIdx},${platoIdx})">
        </div>
        <!-- Campos -->
        <div class="plato-fields">
          <div class="field-group">
            <label class="field-label">Nombre del plato</label>
            <input class="field-input" id="nombre-${id}" value="${esc(plato.nombre)}" placeholder="Nombre del plato">
          </div>
          <div class="field-group">
            <label class="field-label">Descripción</label>
            <textarea class="field-input" id="desc-${id}" placeholder="Descripción del plato">${esc(plato.descripcion)}</textarea>
          </div>
          <div class="field-group">
            <label class="field-label">Precio (sin ITBMS)</label>
            <div class="price-wrap">
              <span class="price-prefix">$</span>
              <input class="field-input" type="number" id="precio-${id}" value="${plato.precio}" min="0" step="0.50" placeholder="0.00">
            </div>
          </div>
        </div>
        <!-- Acciones -->
        <div class="plato-actions">
          <button class="btn-del" onclick="deletePlato(${catIdx},${platoIdx})"><i class="fa-solid fa-trash"></i> Eliminar</button>
          <button class="btn-save-plato" id="btn-${id}" onclick="savePlato('${id}',${catIdx},${platoIdx})">
            <i class="fa-solid fa-floppy-disk"></i> Guardar
          </button>
        </div>
      </div>`;
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Subir imagen al VPS (backend Flask) ───────────────────────────────
  async function uploadImagen(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('folder', 'restaurante');

    const r = await window.authFetch(`${API_BASE}/upload-image`, {
      method: 'POST',
      body: formData,
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${r.status}`);
    }
    const data = await r.json();
    // El backend devuelve una ruta relativa (/static/uploads/...); la
    // convertimos en URL absoluta contra el mismo backend que la sirve.
    return `${API_BASE}${data.url}`;
  }

  // ── Modal de recorte ──────────────────────────────────────────────────
  let _cropCallback = null;

  function abrirCrop(src, callback) {
    _cropCallback = callback;
    // Crear modal si no existe
    if (!document.getElementById('crop-modal')) {
      const m = document.createElement('div');
      m.id = 'crop-modal';
      m.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px';
      m.innerHTML = `
        <div style="color:#fff;font-size:.9rem;font-weight:600;text-align:center">
          Arrastra o haz zoom para centrar el producto
        </div>
        <div style="font-size:.72rem;color:rgba(255,255,255,.4);text-align:center;margin-top:-8px">
          Proporción 4:3 · igual a la tarjeta del restaurante
        </div>
        <div id="crop-viewport" style="width:320px;height:240px;border-radius:10px;overflow:hidden;position:relative;background:#000;cursor:move;touch-action:none">
          <img id="crop-img" style="position:absolute;transform-origin:0 0" draggable="false">
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <span style="color:rgba(255,255,255,.6);font-size:.8rem">Zoom</span>
          <input id="crop-zoom" type="range" min="0.5" max="3" step="0.05" value="1" style="width:160px;accent-color:var(--gold)">
          <span id="crop-zoom-lbl" style="color:#fff;font-size:.8rem;min-width:36px">1.0×</span>
        </div>
        <div style="display:flex;gap:10px">
          <button id="crop-cancel" style="padding:10px 24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;cursor:pointer;font-family:inherit;font-size:.85rem">Cancelar</button>
          <button id="crop-ok" style="padding:10px 28px;background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700">✓ Usar esta imagen</button>
        </div>`;
      document.body.appendChild(m);

      // Zoom slider
      const zoomSlider = document.getElementById('crop-zoom');
      const zoomLbl    = document.getElementById('crop-zoom-lbl');
      zoomSlider.addEventListener('input', () => {
        zoomLbl.textContent = parseFloat(zoomSlider.value).toFixed(1) + '×';
        applyCropTransform();
      });

      // Drag
      const vp = document.getElementById('crop-viewport');
      let dragging=false, startX=0, startY=0, ox=0, oy=0;
      vp.addEventListener('mousedown', e => { dragging=true; startX=e.clientX-ox; startY=e.clientY-oy; e.preventDefault(); });
      window.addEventListener('mousemove', e => { if(!dragging)return; ox=e.clientX-startX; oy=e.clientY-startY; applyCropTransform(); });
      window.addEventListener('mouseup', ()=>dragging=false);
      // Touch
      vp.addEventListener('touchstart', e => { dragging=true; startX=e.touches[0].clientX-ox; startY=e.touches[0].clientY-oy; }, {passive:true});
      window.addEventListener('touchmove', e => { if(!dragging)return; ox=e.touches[0].clientX-startX; oy=e.touches[0].clientY-startY; applyCropTransform(); }, {passive:true});
      window.addEventListener('touchend', ()=>dragging=false);

      document.getElementById('crop-cancel').onclick = () => {
        document.getElementById('crop-modal').style.display = 'none';
        _cropCallback = null;
      };
      document.getElementById('crop-ok').onclick = () => {
        const result = exportCrop();
        document.getElementById('crop-modal').style.display = 'none';
        if (_cropCallback) _cropCallback(result);
        _cropCallback = null;
      };
    }

    // Cargar imagen
    const img = document.getElementById('crop-img');
    img._ox = 0; img._oy = 0;
    document.getElementById('crop-zoom').value = 1;
    document.getElementById('crop-zoom-lbl').textContent = '1.0×';
    // Reset offset
    const vp2 = document.getElementById('crop-viewport');
    vp2._ox = 0; vp2._oy = 0;
    // Necesitamos acceso al offset desde applyCropTransform
    window._cropOx = 0; window._cropOy = 0;

    img.onload = () => {
      // Zoom inicial para que llene el viewport (320×240 — proporción tarjeta restaurante)
      const vW=320, vH=240;
      const scale = Math.max(vW/img.naturalWidth, vH/img.naturalHeight);
      document.getElementById('crop-zoom').value = Math.min(3, scale.toFixed(2));
      document.getElementById('crop-zoom-lbl').textContent = parseFloat(document.getElementById('crop-zoom').value).toFixed(1) + '×';
      window._cropOx = (vW - img.naturalWidth * scale) / 2;
      window._cropOy = (vH - img.naturalHeight * scale) / 2;
      // Reasignar drag con nuevo offset
      const vp3 = document.getElementById('crop-viewport');
      vp3._dragStartX = null;
      applyCropTransform();
    };
    img.src = src;
    document.getElementById('crop-modal').style.display = 'flex';
  }

  function applyCropTransform() {
    const img   = document.getElementById('crop-img');
    const scale = parseFloat(document.getElementById('crop-zoom').value);
    if (!img) return;
    img.style.transform = `translate(${window._cropOx||0}px,${window._cropOy||0}px) scale(${scale})`;
  }

  // Sobreescribir drag para actualizar _cropOx/_cropOy
  (function() {
    let dragging=false, startX=0, startY=0;
    document.addEventListener('mousedown', e => {
      const vp = document.getElementById('crop-viewport');
      if (vp && vp.contains(e.target)) { dragging=true; startX=e.clientX-(window._cropOx||0); startY=e.clientY-(window._cropOy||0); }
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      window._cropOx = e.clientX-startX; window._cropOy = e.clientY-startY;
      applyCropTransform();
    });
    document.addEventListener('mouseup', ()=>dragging=false);
    document.addEventListener('touchstart', e => {
      const vp = document.getElementById('crop-viewport');
      if (vp && vp.contains(e.target)) { dragging=true; startX=e.touches[0].clientX-(window._cropOx||0); startY=e.touches[0].clientY-(window._cropOy||0); }
    }, {passive:true});
    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      window._cropOx = e.touches[0].clientX-startX; window._cropOy = e.touches[0].clientY-startY;
      applyCropTransform();
    }, {passive:true});
    document.addEventListener('touchend', ()=>dragging=false);
  })();

  function exportCrop() {
    const img   = document.getElementById('crop-img');
    const scale = parseFloat(document.getElementById('crop-zoom').value);
    const vW=320, vH=240;
    const canvas = document.createElement('canvas');
    canvas.width  = vW;
    canvas.height = vH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,
      -(window._cropOx||0)/scale, -(window._cropOy||0)/scale,
      vW/scale, vH/scale,
      0, 0, vW, vH
    );
    return canvas.toDataURL('image/jpeg', 0.88);
  }

  // ── Manejar foto — con editor de recorte ─────────────────────────────
  async function handleFoto(event, id, catIdx, platoIdx) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('La foto supera 5 MB. Comprime la imagen antes de subirla.', 'error');
      return;
    }

    const reader = new FileReader();
    reader.onload = e => {
      // Abrir editor de recorte
      abrirCrop(e.target.result, async (croppedDataUrl) => {
        // Actualizar preview — buscar el contenedor padre y reemplazar contenido
        const wrap = document.getElementById(`img-preview-${id}`);
        const container = wrap ? wrap.parentElement : null;
        if (container) {
          // Crear nuevo img y reemplazar lo que haya
          const newImg = document.createElement('img');
          newImg.id    = `img-preview-${id}`;
          newImg.src   = croppedDataUrl;
          newImg.alt   = 'foto';
          newImg.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
          if (wrap) wrap.replaceWith(newImg);
        }

        const cat   = menuData.categorias[catIdx];
        const plato = cat.platos[platoIdx];

        const btn = document.getElementById(`btn-p-${catIdx}-${platoIdx}`);
        const prevText = btn?.textContent;
        if (btn) { btn.textContent = '📤 Subiendo...'; btn.disabled = true; }
        showToast('Subiendo imagen...', 'success');

        try {
          // Guardar base64 inmediatamente para que se vea de inmediato
          menuData.categorias[catIdx].platos[platoIdx].foto = croppedDataUrl;
          // Preview ya actualizado arriba

          // Subir al VPS (backend Flask)
          const res  = await fetch(croppedDataUrl);
          const blob = await res.blob();
          const croppedFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type:'image/jpeg'});
          const url = await uploadImagen(croppedFile);

          // Si la subida fue exitosa, reemplazar base64 por la URL del VPS
          menuData.categorias[catIdx].platos[platoIdx].foto = url;
          // Actualizar src del img ya existente en el DOM
          const imgEl2 = document.getElementById(`img-preview-${id}`);
          if (imgEl2?.tagName === 'IMG') imgEl2.src = url;
          showToast('✅ Imagen subida al servidor. Guarda para confirmar.', 'success');
        } catch (err) {
          console.warn('Upload failed, usando base64:', err);
          // Ya se guardó el base64 — la imagen se ve correctamente, pero
          // ocupa más espacio en la fila hasta que subas de nuevo con el
          // backend disponible.
          showToast('⚠️ No se pudo subir al servidor (¿está corriendo el backend?). Imagen guardada localmente por ahora.', 'error');
        } finally {
          if (btn) { btn.textContent = prevText || '💾 Guardar'; btn.disabled = false; }
        }
      });
    };
    reader.readAsDataURL(file);
  }

  // ── Guardar plato individual ──────────────────────────────────────────
  function savePlato(id, catIdx, platoIdx) {
    const nombre = document.getElementById(`nombre-${id}`).value.trim();
    const desc   = document.getElementById(`desc-${id}`).value.trim();
    const precio = parseFloat(document.getElementById(`precio-${id}`).value) || 0;
    if (!nombre) { showToast('Ingresa el nombre del plato.', 'error'); return; }
    menuData.categorias[catIdx].platos[platoIdx].nombre      = nombre;
    menuData.categorias[catIdx].platos[platoIdx].descripcion = desc;
    menuData.categorias[catIdx].platos[platoIdx].precio      = precio;
    const btn = document.getElementById(`btn-${id}`);
    btn.textContent = '✓ Guardado localmente';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '💾 Guardar'; btn.classList.remove('saved'); }, 2000);
    showToast('Cambios guardados localmente. Usa "Guardar todo" para publicar.', 'success');
  }

  // ── Añadir plato ─────────────────────────────────────────────────────
  function addPlato(catIdx) {
    const cat = menuData.categorias[catIdx];
    const newPlato = {
      id: `${cat.id}_${Date.now()}`,
      nombre: 'Nuevo plato',
      descripcion: '',
      precio: 0,
      foto: ''
    };
    cat.platos.push(newPlato);
    renderSidebar();
    renderCategoria(catIdx);
    showToast('Plato añadido. Edita los campos y guarda.', 'success');
    // Scroll al nuevo plato
    setTimeout(() => {
      const grid = document.getElementById(`platos-grid-${catIdx}`);
      grid?.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  // ── Eliminar plato ────────────────────────────────────────────────────
  function deletePlato(catIdx, platoIdx) {
    const nombre = menuData.categorias[catIdx].platos[platoIdx].nombre;
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer hasta guardar todo.`)) return;
    menuData.categorias[catIdx].platos.splice(platoIdx, 1);
    renderSidebar();
    renderCategoria(catIdx);
    showToast(`"${nombre}" eliminado. Guarda todo para confirmar.`, 'success');
  }

  // ── Guardar todo en Supabase ────────────────────────────────────────────
  async function saveAll() {
    const btn = document.getElementById('btn-save-all');
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';
    setLoading(true);
    try {
      await sbSaveMenu(menuData);
      showToast('✅ Menú guardado correctamente en Supabase.', 'success');
      renderSidebar();
    } catch (e) {
      console.error(e);
      showToast('❌ Error al guardar en Supabase. Revisa la consola.', 'error');
    } finally {
      setLoading(false);
      btn.disabled = false;
      btn.textContent = '💾 Guardar todo';
    }
  }

  init();
</script>
</body>
</html>
