<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Editor de Menú — Sanagua Lodge</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/images/icon/icon.PNG">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f3ee;--surface:#fff;--ink:#1a1814;--muted:#6b6660;
      --accent:#c8541a;--border:#e0dbd4;--success:#2d7a4f;--gold:#c9923a;
      --earth:#8b5e3c;--sage:#6b8f6b;--red:#c0392b;--r:8px;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

    /* ── HEADER ── */
    header{background:var(--ink);color:#fff;padding:0 28px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .header-left{display:flex;align-items:center;gap:14px}
    .header-logo{font-family:'Playfair Display',serif;font-size:1rem;color:#fff}
    .header-sep{color:rgba(255,255,255,.3);font-size:.9rem}
    .header-title{font-size:.88rem;color:rgba(255,255,255,.7);font-weight:400}
    .header-right{display:flex;align-items:center;gap:10px}
    .btn-back{color:rgba(255,255,255,.6);font-size:.82rem;text-decoration:none;
      padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:6px;transition:all .2s}
    .btn-back:hover{color:#fff;border-color:rgba(255,255,255,.4)}
    .btn-save-all{background:var(--success);color:#fff;border:none;border-radius:6px;
      padding:8px 18px;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;
      cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:6px}
    .btn-save-all:hover{background:#256940}
    .btn-save-all:disabled{background:#aaa;cursor:default}

    /* ── LAYOUT ── */
    .layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 60px)}

    /* ── SIDEBAR ── */
    .sidebar{background:var(--ink);overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
    .sidebar-label{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:rgba(255,255,255,.3);padding:20px 20px 8px}
    .cat-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 20px;
      background:none;border:none;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;
      font-size:.85rem;cursor:pointer;text-align:left;transition:all .2s;
      border-left:3px solid transparent;position:relative}
    .cat-btn:hover{background:rgba(255,255,255,.05);color:#fff}
    .cat-btn.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gold)}
    .cat-btn .cat-icon{font-size:1rem;flex-shrink:0}
    .cat-btn .cat-count{margin-left:auto;font-size:.68rem;background:rgba(255,255,255,.1);
      padding:2px 7px;border-radius:10px;color:rgba(255,255,255,.5)}
    .cat-btn.active .cat-count{background:var(--gold);color:#fff}

    /* ── MAIN ── */
    .main{overflow-y:auto;padding:28px}

    /* Barra superior de categoría */
    .cat-header{display:flex;align-items:center;justify-content:space-between;
      margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .cat-header-left{display:flex;align-items:center;gap:12px}
    .cat-icon-big{font-size:1.8rem}
    .cat-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--ink);font-weight:400}
    .cat-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
    .btn-add{background:var(--accent);color:#fff;border:none;border-radius:6px;
      padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;
      cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
    .btn-add:hover{background:#b34816}

    /* Grid de platos */
    .platos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

    /* Card de plato */
    .plato-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
      overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:box-shadow .2s}
    .plato-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.09)}

    /* Imagen del plato */
    .plato-img-wrap{height:160px;position:relative;background:#f0ece6;
      display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
    .plato-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .plato-img-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;
      color:var(--muted);pointer-events:none}
    .plato-img-placeholder span{font-size:2.5rem;opacity:.4}
    .plato-img-placeholder small{font-size:.7rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.1em;opacity:.5}
    .plato-img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);
      display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
    .plato-img-wrap:hover .plato-img-overlay{opacity:1}
    .plato-img-overlay span{color:#fff;font-size:.8rem;font-weight:600;
      background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px}
    .plato-img-input{display:none}

    /* Campos del plato */
    .plato-fields{padding:16px}
    .field-group{margin-bottom:12px}
    .field-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:var(--muted);margin-bottom:5px;display:block}
    .field-input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:6px;
      font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink);background:var(--bg);
      transition:border-color .2s;outline:none}
    .field-input:focus{border-color:var(--accent);background:#fff}
    textarea.field-input{resize:vertical;min-height:62px;line-height:1.5}
    .price-wrap{display:flex;align-items:center;gap:0}
    .price-prefix{background:var(--border);padding:8px 10px;border:1.5px solid var(--border);
      border-right:none;border-radius:6px 0 0 6px;font-size:.88rem;color:var(--muted);font-weight:600}
    .price-wrap .field-input{border-radius:0 6px 6px 0;flex:1}

    /* Acciones de plato */
    .plato-actions{display:flex;gap:8px;padding:0 16px 14px}
    .btn-del{background:none;border:1.5px solid var(--border);border-radius:6px;
      padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:.78rem;
      color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
    .btn-del:hover{border-color:var(--red);color:var(--red)}
    .btn-save-plato{background:var(--accent);color:#fff;border:none;border-radius:6px;
      padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;
      cursor:pointer;transition:background .2s;flex:1}
    .btn-save-plato:hover{background:#b34816}
    .btn-save-plato.saved{background:var(--success)}

    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;z-index:999;
      background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
      font-size:.85rem;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.3);
      opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.success{background:var(--success)}
    .toast.error{background:var(--red)}

    /* Estado vacío */
    .empty-cat{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-cat .empty-icon{font-size:3rem;margin-bottom:12px}
    .empty-cat p{font-size:.88rem;margin-bottom:16px}

    /* Loading */
    .loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);
      z-index:999;display:none;align-items:center;justify-content:center}
    .loading-overlay.show{display:flex}
    .spinner{width:36px;height:36px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:700px){
      .layout{grid-template-columns:1fr}
      .sidebar{display:none}
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <span class="header-logo">🌿 Sanagua</span>
    <span class="header-sep">›</span>
    <span class="header-title">Editor de Menú · Restaurante</span>
  </div>
  <div class="header-right">
    <a class="btn-back" href="achive.html">← Sistema</a>
    <button class="btn-save-all" onclick="saveAll()" id="btn-save-all">
      💾 Guardar todo
    </button>
  </div>
</header>

<!-- Barra de configuración de repo público -->
<div id="config-bar" style="background:#2a1f18;padding:8px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)">
  <span style="font-size:.75rem;color:rgba(255,255,255,.5)">📁 Imágenes se guardan en repo público:</span>
  <code id="config-repo-pub" style="font-size:.75rem;color:var(--gold)">—</code>
  <span style="font-size:.75rem;color:rgba(255,255,255,.3)">→ assets/images/restaurante/ → GitHub Pages</span>
</div>

<div class="layout">

  <!-- Sidebar de categorías -->
  <aside class="sidebar">
    <div class="sidebar-label">Categorías</div>
    <div id="sidebar-cats"></div>
  </aside>

  <!-- Panel principal -->
  <main class="main" id="main-content">
    <div class="empty-cat">
      <div class="empty-icon">🍽️</div>
      <p>Cargando menú...</p>
    </div>
  </main>

</div>

<!-- Toast y loading -->
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
  // ── Config GitHub ───────────────────────────────────────────────────
  // ── Config repos ────────────────────────────────────────────────────
  const GT = localStorage.getItem('gh_token')  || '';
  const GR = localStorage.getItem('gh_repo')   || '';  // repo privado (datos)
  const GB = localStorage.getItem('gh_branch') || 'main';
  // Repo público (GitHub Pages) — guarda en localStorage como gh_repo_public
  // Formato: "usuario/nombre-repo-publico"
  // Si no está configurado, usa el mismo repo privado como fallback
  const GR_PUBLIC = localStorage.getItem('gh_repo_public') || GR;

  // ── Verificar sesión ────────────────────────────────────────────────
  (function(){
    const raw = sessionStorage.getItem('sl_session');
    if (!raw) { window.location.href = '../index.html'; return; }
    try {
      const s = JSON.parse(raw);
      if (!s.role || (Date.now() - s.ts) > 8*3600*1000) {
        sessionStorage.removeItem('sl_session');
        window.location.href = '../index.html';
      }
    } catch { window.location.href = '../index.html'; }
  })();

  // ── GitHub helpers ──────────────────────────────────────────────────
  async function ghRead(filename) {
    try {
      const r = await fetch(
        `https://api.github.com/repos/${GR}/contents/Data/json/${filename}?ref=${GB}`,
        { headers: { 'Authorization': `token ${GT}`, 'Accept': 'application/vnd.github.v3+json' } }
      );
      if (!r.ok) return null;
      const d = await r.json();
      const bytes = Uint8Array.from(atob(d.content.replace(/\s/g,'')), c => c.charCodeAt(0));
      return { data: JSON.parse(new TextDecoder('utf-8').decode(bytes)), sha: d.sha };
    } catch { return null; }
  }

  async function ghWrite(filename, data, sha) {
    const json    = JSON.stringify(data, null, 2);
    const bytes   = new TextEncoder().encode(json);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const content = btoa(bin);
    const payload = { message: `update ${filename}`, content, branch: GB };
    if (sha) payload.sha = sha;
    const r = await fetch(
      `https://api.github.com/repos/${GR}/contents/Data/json/${filename}`,
      { method:'PUT', headers:{ 'Authorization':`token ${GT}`, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' }, body: JSON.stringify(payload) }
    );
    return r.ok;
  }

  // ── Estado ──────────────────────────────────────────────────────────
  let menuData  = null;
  let menuSha   = null;
  let catActual = 0;

  // ── Toast ───────────────────────────────────────────────────────────
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = 'toast', 3000);
  }

  function setLoading(v) {
    document.getElementById('loading').classList.toggle('show', v);
  }

  // ── Init ────────────────────────────────────────────────────────────
  async function init() {
    // Mostrar repo público en barra de config
    const el = document.getElementById('config-repo-pub');
    if (el) el.textContent = GR_PUBLIC || 'No configurado';

    if (!GT || !GR) {
      document.getElementById('main-content').innerHTML = `
        <div class="empty-cat">
          <div class="empty-icon">⚙️</div>
          <p>Configura la conexión a GitHub en el sistema de cotizaciones primero.</p>
          <a href="achive.html" style="color:var(--accent)">← Ir al sistema</a>
        </div>`;
      return;
    }
    setLoading(true);
    const res = await ghRead('menu.json');
    setLoading(false);
    if (!res) {
      showToast('No se encontró menu.json. Créalo desde el sistema.', 'error');
      return;
    }
    menuData = res.data;
    menuSha  = res.sha;
    renderSidebar();
    renderCategoria(0);
  }

  // ── Sidebar ─────────────────────────────────────────────────────────
  function renderSidebar() {
    document.getElementById('sidebar-cats').innerHTML =
      menuData.categorias.map((cat, i) => `
        <button class="cat-btn ${i===catActual?'active':''}" onclick="renderCategoria(${i})">
          <span class="cat-icon">${cat.icon}</span>
          <span>${cat.label}</span>
          <span class="cat-count">${cat.platos.length}</span>
        </button>`).join('');
  }

  // ── Renderizar categoría ────────────────────────────────────────────
  function renderCategoria(idx) {
    catActual = idx;
    renderSidebar();
    const cat = menuData.categorias[idx];
    document.getElementById('main-content').innerHTML = `
      <div class="cat-header">
        <div class="cat-header-left">
          <div class="cat-icon-big">${cat.icon}</div>
          <div>
            <div class="cat-name">${cat.label}</div>
            <div class="cat-sub">${cat.subtitulo} · ${cat.platos.length} plato${cat.platos.length===1?'':'s'}</div>
          </div>
        </div>
        <button class="btn-add" onclick="addPlato(${idx})">+ Añadir plato</button>
      </div>
      <div class="platos-grid" id="platos-grid-${idx}">
        ${cat.platos.length === 0
          ? `<div class="empty-cat" style="grid-column:1/-1"><div class="empty-icon">🍴</div><p>No hay platos aún.</p></div>`
          : cat.platos.map((p, pi) => renderPlatoCard(idx, pi, p)).join('')
        }
      </div>`;
  }

  // ── Card de plato ────────────────────────────────────────────────────
  function renderPlatoCard(catIdx, platoIdx, plato) {
    const id = `p-${catIdx}-${platoIdx}`;
    const fotoSrc = plato.foto || '';
    return `
      <div class="plato-card" id="card-${id}">
        <!-- Imagen -->
        <div class="plato-img-wrap" onclick="document.getElementById('img-input-${id}').click()">
          ${fotoSrc
            ? `<img id="img-preview-${id}" src="${fotoSrc}" alt="${plato.nombre}">`
            : `<div class="plato-img-placeholder" id="img-preview-${id}">
                <span>🍽️</span><small>Subir foto</small>
               </div>`
          }
          <div class="plato-img-overlay"><span>📷 Cambiar foto</span></div>
          <input type="file" class="plato-img-input" id="img-input-${id}" accept="image/*"
            onchange="handleFoto(event,'${id}',${catIdx},${platoIdx})">
        </div>
        <!-- Campos -->
        <div class="plato-fields">
          <div class="field-group">
            <label class="field-label">Nombre del plato</label>
            <input class="field-input" id="nombre-${id}" value="${esc(plato.nombre)}" placeholder="Nombre del plato">
          </div>
          <div class="field-group">
            <label class="field-label">Descripción</label>
            <textarea class="field-input" id="desc-${id}" placeholder="Descripción del plato">${esc(plato.descripcion)}</textarea>
          </div>
          <div class="field-group">
            <label class="field-label">Precio (sin ITBMS)</label>
            <div class="price-wrap">
              <span class="price-prefix">$</span>
              <input class="field-input" type="number" id="precio-${id}" value="${plato.precio}" min="0" step="0.50" placeholder="0.00">
            </div>
          </div>
        </div>
        <!-- Acciones -->
        <div class="plato-actions">
          <button class="btn-del" onclick="deletePlato(${catIdx},${platoIdx})">🗑 Eliminar</button>
          <button class="btn-save-plato" id="btn-${id}" onclick="savePlato('${id}',${catIdx},${platoIdx})">
            💾 Guardar
          </button>
        </div>
      </div>`;
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Subir imagen a repo público (GitHub Pages) ───────────────────────
  async function uploadImagen(file, catId, platoNombre) {
    const ext   = file.name.split('.').pop().toLowerCase() || 'jpg';
    const slug  = platoNombre.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').slice(0,30);
    const fname = `${catId}-${slug}-${Date.now()}.${ext}`;
    const path  = `assets/images/restaurante/${fname}`;

    // Leer como base64 puro
    const b64raw = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = e => res(e.target.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });

    // Verificar si ya existe (para SHA)
    let sha = null;
    try {
      const chk = await fetch(
        `https://api.github.com/repos/${GR_PUBLIC}/contents/${path}?ref=${GB}`,
        { headers: { 'Authorization': `token ${GT}`, 'Accept': 'application/vnd.github.v3+json' } }
      );
      if (chk.ok) { const d = await chk.json(); sha = d.sha; }
    } catch {}

    // Subir al repo público
    const payload = { message: `add restaurante img: ${fname}`, content: b64raw, branch: GB };
    if (sha) payload.sha = sha;
    const r = await fetch(
      `https://api.github.com/repos/${GR_PUBLIC}/contents/${path}`,
      { method:'PUT', headers:{ 'Authorization':`token ${GT}`, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' }, body: JSON.stringify(payload) }
    );
    if (!r.ok) throw new Error(`HTTP ${r.status}`);

    // URL pública de GitHub Pages
    const owner    = GR_PUBLIC.split('/')[0];
    const repoName = GR_PUBLIC.split('/')[1];
    return `https://${owner}.github.io/${repoName}/${path}`;
  }

  // ── Manejar foto ──────────────────────────────────────────────────────
  async function handleFoto(event, id, catIdx, platoIdx) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) {
      showToast('La foto supera 3 MB. Comprime la imagen antes de subirla.', 'error');
      return;
    }

    // Preview inmediato con base64 local mientras sube
    const reader = new FileReader();
    reader.onload = async e => {
      const b64preview = e.target.result;
      // Mostrar preview inmediato
      const wrap = document.getElementById(`img-preview-${id}`);
      if (wrap?.tagName === 'IMG') {
        wrap.src = b64preview;
      } else if (wrap) {
        wrap.outerHTML = `<img id="img-preview-${id}" src="${b64preview}" alt="foto" style="width:100%;height:100%;object-fit:cover">`;
      }

      const cat   = menuData.categorias[catIdx];
      const plato = cat.platos[platoIdx];

      // Mostrar estado de subida
      const btn = document.getElementById(`btn-p-${catIdx}-${platoIdx}`);
      const prevText = btn?.textContent;
      if (btn) { btn.textContent = '📤 Subiendo...'; btn.disabled = true; }
      showToast('Subiendo imagen a GitHub...', 'success');

      try {
        const url = await uploadImagen(file, cat.id, plato.nombre);
        // Guardar URL pública en los datos (no base64)
        menuData.categorias[catIdx].platos[platoIdx].foto = url;
        // Actualizar preview con URL final
        const img = document.getElementById(`img-preview-${id}`);
        if (img) img.src = url;
        showToast('✅ Imagen subida correctamente. Guarda el plato para confirmar.', 'success');
      } catch (err) {
        console.warn('Upload failed:', err);
        // Fallback: guardar base64 si falla la subida
        menuData.categorias[catIdx].platos[platoIdx].foto = b64preview;
        showToast('⚠️ No se pudo subir al repo. Se usará imagen local.', 'error');
      } finally {
        if (btn) { btn.textContent = prevText || '💾 Guardar'; btn.disabled = false; }
      }
    };
    reader.readAsDataURL(file);
  }

  // ── Guardar plato individual ──────────────────────────────────────────
  function savePlato(id, catIdx, platoIdx) {
    const nombre = document.getElementById(`nombre-${id}`).value.trim();
    const desc   = document.getElementById(`desc-${id}`).value.trim();
    const precio = parseFloat(document.getElementById(`precio-${id}`).value) || 0;
    if (!nombre) { showToast('Ingresa el nombre del plato.', 'error'); return; }
    menuData.categorias[catIdx].platos[platoIdx].nombre      = nombre;
    menuData.categorias[catIdx].platos[platoIdx].descripcion = desc;
    menuData.categorias[catIdx].platos[platoIdx].precio      = precio;
    const btn = document.getElementById(`btn-${id}`);
    btn.textContent = '✓ Guardado localmente';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '💾 Guardar'; btn.classList.remove('saved'); }, 2000);
    showToast('Cambios guardados localmente. Usa "Guardar todo" para publicar.', 'success');
  }

  // ── Añadir plato ─────────────────────────────────────────────────────
  function addPlato(catIdx) {
    const cat = menuData.categorias[catIdx];
    const newPlato = {
      id: `${cat.id}_${Date.now()}`,
      nombre: 'Nuevo plato',
      descripcion: '',
      precio: 0,
      foto: ''
    };
    cat.platos.push(newPlato);
    renderSidebar();
    renderCategoria(catIdx);
    showToast('Plato añadido. Edita los campos y guarda.', 'success');
    // Scroll al nuevo plato
    setTimeout(() => {
      const grid = document.getElementById(`platos-grid-${catIdx}`);
      grid?.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }

  // ── Eliminar plato ────────────────────────────────────────────────────
  function deletePlato(catIdx, platoIdx) {
    const nombre = menuData.categorias[catIdx].platos[platoIdx].nombre;
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer hasta guardar todo.`)) return;
    menuData.categorias[catIdx].platos.splice(platoIdx, 1);
    renderSidebar();
    renderCategoria(catIdx);
    showToast(`"${nombre}" eliminado. Guarda todo para confirmar.`, 'success');
  }

  // ── Guardar todo en GitHub ────────────────────────────────────────────
  async function saveAll() {
    const btn = document.getElementById('btn-save-all');
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';
    setLoading(true);
    try {
      const ok = await ghWrite('menu.json', menuData, menuSha);
      if (!ok) throw new Error();
      // Actualizar SHA
      const res = await ghRead('menu.json');
      if (res) menuSha = res.sha;
      showToast('✅ Menú guardado correctamente en GitHub.', 'success');
      renderSidebar();
    } catch {
      showToast('❌ Error al guardar. Verifica la conexión a GitHub.', 'error');
    } finally {
      setLoading(false);
      btn.disabled = false;
      btn.textContent = '💾 Guardar todo';
    }
  }

  init();
</script>
</body>
</html>
