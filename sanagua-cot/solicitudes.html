<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="../assets/images/icon/icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Solicitudes — Sanagua Lodge</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/achive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script src="../assets/js/admin-nav.js"></script>
  <style>
    .hh-header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;
      align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .hh-header a{color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem}
    .hh-header a:hover{color:#fff}
    .hh-title{font-family:'DM Serif Display',serif;font-size:1.1rem}
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
</head>
<body>

<div class="hh-header">
  <span class="hh-title"><i class="fa-inbox"></i> Solicitudes de reserva</span>
  <a href="achive.html">← Volver al sistema</a>
</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<div class="container">
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;">
      <div class="card-title" style="margin:0"><i class="fa-inbox"></i> Solicitudes de reserva</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="sol-filtro" onchange="filtrarSolicitudes()" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:.82rem;background:var(--surface)">
          <option value="todas">Todas</option>
          <option value="pendiente"><i class="fa-hourglass-half"></i> Pendientes</option>
          <option value="en_proceso"><i class="fa-arrows-rotate"></i> En proceso</option>
          <option value="confirmada"><i class="fa-circle-check"></i> Confirmadas</option>
          <option value="completada"><i class="fa-circle-check"></i> Completadas</option>
          <option value="rechazada"><i class="fa-circle-xmark"></i> Rechazadas</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="loadSolicitudes()"><i class="fa-arrows-rotate"></i> Recargar</button>
      </div>
    </div>
    <p style="font-size:.82rem;color:var(--muted);margin-bottom:16px">
      Solicitudes enviadas desde las páginas de servicios. Aprueba para añadir al calendario o rechaza para notificar al cliente.
    </p>
    <div style="margin-bottom:16px">
      <input type="text" id="sol-buscar" placeholder="🔍 Buscar por nombre o correo..." oninput="filtrarSolicitudes()"
        style="width:100%;max-width:360px;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:.85rem;outline:none;transition:border-color .2s"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    </div>
    <div id="sol-stats" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px"></div>
    <div id="sol-lista" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
      <div style="color:var(--muted);font-size:.85rem;padding:20px 0">Cargando solicitudes...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL      = 'https://cjgdlskybcaacbpnncuw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqZ2Rsc2t5YmNhYWNicG5uY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTAwNjMsImV4cCI6MjEwMDM4NjA2M30.6UVRJBUxmLBo1ffTd7tZtfLald6Sm0qTmWi5Tx4HH98';
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showLoading(v){ document.getElementById('loading').style.display = v ? 'flex' : 'none'; }
  function showToast(msg, type='success'){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 3800);
  }

  function _quoteRowToRecord(row) {
    return {
      ...row.data, quote_num: row.quote_num, estado: row.estado, categoria: row.categoria,
      plataforma: row.plataforma, visit_date: row.visit_date, visit_date_end: row.visit_date_end,
      total: Number(row.total)||0, abono_pagado: Number(row.abono_pagado)||0,
      cancelacion_pagada: Number(row.cancelacion_pagada)||0, created_at: row.created_at, updated_at: row.updated_at,
    };
  }
  async function sbNextWebNum() {
    const { data, error } = await supa.rpc('increment_counter', { counter_name: 'web' });
    if (error) throw error;
    return `WEB${String(data).padStart(2, '0')}`;
  }
  async function sbInsertQuote(payload, quoteNum) {
    const row = {
      quote_num: quoteNum, estado: payload.estado || 'Pendiente', categoria: payload.categoria || null,
      plataforma: payload.plataforma || null, client_name: payload.client?.name || null,
      visit_date: payload.visit_date || null, visit_date_end: payload.visit_date_end || null,
      total: payload.total || 0, abono_pagado: payload.abono_pagado || 0,
      cancelacion_pagada: payload.cancelacion_pagada || 0, data: payload,
    };
    const { data, error } = await supa.from('quotes').insert(row).select().single();
    if (error) throw error;
    return _quoteRowToRecord(data);
  }

  let allHistory = []; // solo para no romper el push al confirmar una solicitud


  async function loadSolicitudes() {
    document.getElementById('sol-lista').innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:20px 0">Cargando...</div>';
    try {
      const { data, error } = await supa.from('solicitudes').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      solicitudesData = data || [];
    } catch (e) {
      console.error(e);
      document.getElementById('sol-lista').innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:20px 0">Error al cargar las solicitudes.</div>';
      return;
    }
    renderSolicitudes();
  }

  function filtrarSolicitudes() { renderSolicitudes(); }

  function renderSolicitudes() {
    const filtro  = document.getElementById('sol-filtro')?.value || 'todas';
    const buscar  = (document.getElementById('sol-buscar')?.value || '').toLowerCase().trim();
    let lista = filtro === 'todas' ? solicitudesData : solicitudesData.filter(s => s.estado === filtro);
    if (buscar) {
      lista = lista.filter(s =>
        (s.contacto?.nombre||'').toLowerCase().includes(buscar) ||
        (s.contacto?.email||'').toLowerCase().includes(buscar)
      );
    }

    // Stats
    const pend = solicitudesData.filter(s=>s.estado==='pendiente').length;
    const proc = solicitudesData.filter(s=>s.estado==='en_proceso').length;
    const done = solicitudesData.filter(s=>['confirmada','completada'].includes(s.estado)).length;
    const rech = solicitudesData.filter(s=>s.estado==='rechazada').length;
    document.getElementById('sol-stats').innerHTML = `
      <div class="sol-stat-card"><div class="sol-stat-n">${solicitudesData.length}</div><div class="sol-stat-l">Total</div></div>
      <div class="sol-stat-card" style="border-color:#f0d060"><div class="sol-stat-n" style="color:#b45309">${pend}</div><div class="sol-stat-l">Pendientes</div></div>
      <div class="sol-stat-card" style="border-color:#e0e0e0"><div class="sol-stat-n" style="color:var(--muted)">${proc}</div><div class="sol-stat-l">En proceso</div></div>
      <div class="sol-stat-card" style="border-color:#c0ddb8"><div class="sol-stat-n" style="color:var(--success)">${done}</div><div class="sol-stat-l">Confirmadas</div></div>
      <div class="sol-stat-card" style="border-color:#f0c0c0"><div class="sol-stat-n" style="color:var(--red)">${rech}</div><div class="sol-stat-l">Rechazadas</div></div>`;

    if (!lista.length) {
      document.getElementById('sol-lista').innerHTML = `<div style="color:var(--muted);font-size:.85rem;padding:40px 0;text-align:center;grid-column:1/-1"><i class="fa-envelope-open"></i> No hay solicitudes ${filtro==='todas'?'':'con estado "'+filtro+'"'}</div>`;
      return;
    }

    // Ordenar: pendientes primero, luego por fecha desc
    const ordenadas = [...lista].sort((a,b) => {
      if (a.estado==='pendiente' && b.estado!=='pendiente') return -1;
      if (a.estado!=='pendiente' && b.estado==='pendiente') return 1;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    const BADGE_TXT = { pendiente:'<i class="fa-hourglass-half"></i> Pendiente', en_proceso:'<i class="fa-arrows-rotate"></i> En proceso', confirmada:'<i class="fa-circle-check"></i> Confirmada', completada:'<i class="fa-circle-check"></i> Completada', rechazada:'<i class="fa-circle-xmark"></i> Rechazada' };

    document.getElementById('sol-lista').innerHTML = ordenadas.map(sol => {
      const badgeTxt = BADGE_TXT[sol.estado] || sol.estado;
      const inicial  = (sol.contacto?.nombre||'?').charAt(0).toUpperCase();
      const fecha    = sol.created_at ? new Date(sol.created_at).toLocaleString('es-PA',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
      const items    = Array.isArray(sol.items) ? sol.items : [];
      const puntosTotal = items.reduce((acc,it)=>acc + (parseInt(it.puntos_fidelidad)||0) * (parseInt(it.cantidad)||1), 0);

      const itemsHtml = items.map(it => `
        <div class="sol-dato"><span class="sol-dato-lbl">${it.categoria||'Ítem'}</span>
          <span class="sol-dato-val">${it.nombre}${it.cantidad>1?` × ${it.cantidad}`:''} — $${(parseFloat(it.precio)||0).toFixed(2)}${it.fecha_visita?` (<i class="fa-calendar-days"></i> ${it.fecha_visita}${it.fecha_visita_fin && it.fecha_visita_fin!==it.fecha_visita?' → '+it.fecha_visita_fin:''})`:''}</span>
        </div>`).join('');

      let acciones;
      if (sol.estado === 'pendiente') {
        acciones = `<button class="btn-sol-done" onclick="cambiarEstadoAdmin('${sol.id}','en_proceso')"><i class="fa-arrows-rotate"></i> Marcar en proceso</button>
          <button class="btn-aprobar" onclick="cambiarEstadoAdmin('${sol.id}','confirmada')"><i class="fa-circle-check"></i> Confirmar</button>
          <button class="btn-rechazar" onclick="cambiarEstadoAdmin('${sol.id}','rechazada')"><i class="fa-circle-xmark"></i> Rechazar</button>`;
      } else if (sol.estado === 'en_proceso') {
        acciones = `<button class="btn-aprobar" onclick="cambiarEstadoAdmin('${sol.id}','confirmada')"><i class="fa-circle-check"></i> Confirmar</button>
          <button class="btn-rechazar" onclick="cambiarEstadoAdmin('${sol.id}','rechazada')"><i class="fa-circle-xmark"></i> Rechazar</button>`;
      } else {
        acciones = `<button class="btn-sol-done">${badgeTxt}${sol.puntos_otorgados>0?` · <i class="fa-star"></i> ${sol.puntos_otorgados} pts otorgados`:''}</button>`;
      }

      return `<div class="sol-card" id="sol-card-${sol.id}">
        <div class="sol-card-head">
          <div class="sol-servicio"><i class="fa-cart-shopping"></i> Solicitud (${items.length} ítem${items.length===1?'':'s'})</div>
          <span class="sol-badge ${sol.estado}">${badgeTxt}</span>
        </div>
        <div class="sol-card-body">
          <div class="sol-usuario">
            <div class="sol-avatar">${inicial}</div>
            <div>
              <div class="sol-u-nombre">${sol.contacto?.nombre||'—'}${sol.contacto?.verificado?' <span title="Cliente verificado" style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:#3d8bfd;border-radius:50%;vertical-align:middle;"><svg viewBox="0 0 24 24" style="width:8px;height:8px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;"><polyline points="20 6 9 17 4 12"></polyline></svg></span>':''}</div>
              <div class="sol-u-contacto">
                ${sol.contacto?.cedula?`<i class="fa-id-card"></i> ${sol.contacto.cedula}`:''}
                ${sol.contacto?.edad?`· <i class="fa-cake-candles"></i> ${sol.contacto.edad} años`:''}
                ${sol.contacto?.telefono?`· <i class="fa-mobile-screen"></i> ${sol.contacto.telefono}`:''}
                ${sol.contacto?.email?`· <i class="fa-envelope"></i> ${sol.contacto.email}`:''}
              </div>
            </div>
          </div>
          <div class="sol-datos">
            ${itemsHtml}
            ${sol.notas_cliente?`<div class="sol-dato"><span class="sol-dato-lbl">Notas</span><span class="sol-dato-val">${sol.notas_cliente}</span></div>`:''}
            <div class="sol-dato"><span class="sol-dato-lbl">Total</span><span class="sol-dato-val">$${parseFloat(sol.total||0).toFixed(2)}</span></div>
            ${puntosTotal>0?`<div class="sol-dato"><span class="sol-dato-lbl">Puntos al confirmar</span><span class="sol-dato-val"><i class="fa-star"></i> ${puntosTotal}</span></div>`:''}
          </div>
          <div class="sol-fecha">Recibida: ${fecha}</div>
        </div>
        <div class="sol-actions">
          ${acciones}
          <button class="btn-sol-del" onclick="eliminarSolicitud('${sol.id}')" title="Eliminar solicitud">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  // Cambia el estado de una solicitud. Si el nuevo estado es "confirmada" o
  // "completada", genera la cotización a partir de sus items (ya vienen con
  // precio/itbms resueltos desde el carrito) y otorga los puntos de
  // fidelidad correspondientes. Si es "rechazada" o "en_proceso", no se
  // otorgan puntos.
  async function cambiarEstadoAdmin(id, nuevoEstado) {
    const sol = solicitudesData.find(s => s.id === id);
    if (!sol) return;
    if (nuevoEstado === 'rechazada' && !confirm('¿Rechazar esta solicitud? El cliente no recibirá notificación automática.')) return;
    if (nuevoEstado === 'confirmada' && !confirm('¿Confirmar esta solicitud? Se creará la cotización y se otorgarán los puntos de fidelidad al cliente.')) return;

    showLoading(true);
    try {
      const { error: errUpd } = await supa.from('solicitudes')
        .update({ estado: nuevoEstado, updated_at: new Date().toISOString() }).eq('id', id);
      if (errUpd) throw errUpd;

      if (nuevoEstado === 'confirmada' || nuevoEstado === 'completada') {
        // 1. Crear la cotización a partir de los items de la solicitud
        if (!sol.quote_num) {
          const items = Array.isArray(sol.items) ? sol.items : [];
          const quoteStr = await sbNextWebNum();
          const nuevaCotizacion = {
            quote_num: quoteStr,
            id: `hist_sol_${id}`,
            tipo: 'cotizacion',
            plataforma: 'web',
            categoria: items.map(i => i.categoria || i.nombre).join(', '),
            estado: 'Confirmada',
            created_at: new Date().toISOString(),
            visit_date: items[0]?.fecha_visita || new Date().toISOString().slice(0,10),
            visit_date_end: items[0]?.fecha_visita_fin || items[0]?.fecha_visita || new Date().toISOString().slice(0,10),
            notes: `Solicitud web #${id.slice(-6)}${sol.notas_cliente ? ' | ' + sol.notas_cliente : ''}`,
            sol_id: id,
            client: {
              name: sol.contacto?.nombre || '—',
              phone: sol.contacto?.telefono || '',
              email: sol.contacto?.email || '',
            },
            items: items.map(i => ({ description: `${i.nombre}${i.cantidad>1?` × ${i.cantidad}`:''}`, quantity: i.cantidad||1, unit_price: parseFloat(i.precio)||0, total: (parseFloat(i.precio)||0)*(i.cantidad||1) })),
            subtotal: sol.subtotal, itbms: sol.itbms, total: sol.total,
            abono: 0, pendiente: sol.total,
          };
          const savedCot = await sbInsertQuote(nuevaCotizacion, quoteStr);
          allHistory.unshift(savedCot);
          
          await supa.from('solicitudes').update({ quote_num: savedCot.quote_num }).eq('id', id);
        }

        // 2. Otorgar puntos de fidelidad (vía RPC — no duplica si ya se otorgaron)
        const { data: puntos, error: errPts } = await supa.rpc('otorgar_puntos_solicitud', { p_solicitud_id: id });
        if (errPts) console.warn('otorgar_puntos_solicitud', errPts);
        else if (puntos > 0) showToast(`⭐ ${puntos} puntos de fidelidad otorgados al cliente.`, 'success');
      }

      await loadSolicitudes();
      showToast('✅ Solicitud actualizada.', 'success');
    } catch (e) {
      console.error(e);
      showToast('❌ Error al actualizar la solicitud.', 'error');
    } finally {
      showLoading(false);
    }
  }

  async function eliminarSolicitud(id) {
    if (!confirm('¿Eliminar esta solicitud? Esta acción no se puede deshacer. La cotización ya generada (si existe) NO se borra.')) return;
    showLoading(true);
    try {
      const { error } = await supa.from('solicitudes').delete().eq('id', id);
      if (error) throw error;
      await loadSolicitudes();
      showToast('Solicitud eliminada.', 'success');
    } catch (e) {
      console.error(e);
      showToast('❌ Error al eliminar la solicitud.', 'error');
    } finally {
      showLoading(false);
    }
  }

  document.addEventListener('admin-ready', () => { loadSolicitudes(); });
</script>
</body>
</html>
