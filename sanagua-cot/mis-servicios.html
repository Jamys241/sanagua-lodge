<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="assets/images/icon/icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mis Servicios — Sanagua Lodge</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f3ee;--surface:#fff;--ink:#1a1814;--muted:#6b6660;
      --accent:#c8541a;--border:#e0dbd4;--success:#2d7a4f;--gold:#c9923a;
      --earth:#8b5e3c;--sage:#6b8f6b;--red:#c0392b;--r:8px;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

    /* ── HEADER ── */
    header{background:var(--ink);color:#fff;padding:0 28px;height:60px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .header-left{display:flex;align-items:center;gap:14px}
    .header-logo{font-family:'Playfair Display',serif;font-size:1rem;color:#fff}
    .header-sep{color:rgba(255,255,255,.3);font-size:.9rem}
    .header-title{font-size:.88rem;color:rgba(255,255,255,.7);font-weight:400}
    .header-right{display:flex;align-items:center;gap:10px}
    .btn-back{color:rgba(255,255,255,.6);font-size:.82rem;text-decoration:none;
      padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:6px;transition:all .2s}
    .btn-back:hover{color:#fff;border-color:rgba(255,255,255,.4)}

    /* ── LAYOUT ── */
    .layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 60px)}

    /* ── SIDEBAR ── */
    .sidebar{background:var(--ink);overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
    .sidebar-label{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:rgba(255,255,255,.3);padding:20px 20px 8px}
    .cat-btn-wrap{display:flex;align-items:stretch;border-left:3px solid transparent}
    .cat-btn-wrap.active{background:rgba(255,255,255,.08);border-left-color:var(--gold)}
    .cat-btn{flex:1;display:flex;align-items:center;gap:10px;padding:12px 8px 12px 17px;
      background:none;border:none;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;
      font-size:.85rem;cursor:pointer;text-align:left;transition:all .2s;min-width:0}
    .cat-btn:hover{color:#fff}
    .cat-btn-wrap.active .cat-btn{color:#fff}
    .cat-btn .cat-nombre-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cat-btn .cat-count{margin-left:auto;font-size:.68rem;background:rgba(255,255,255,.1);
      padding:2px 7px;border-radius:10px;color:rgba(255,255,255,.5);flex-shrink:0}
    .cat-btn-wrap.active .cat-count{background:var(--gold);color:#fff}
    .cat-eye{background:none;border:none;color:rgba(255,255,255,.4);font-size:.9rem;cursor:pointer;
      padding:6px 8px;flex-shrink:0}
    .cat-eye:hover{color:#fff}
    .cat-eye.off{opacity:.35}
    .btn-add-cat{width:calc(100% - 20px);margin:14px 10px;background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.7);border:1px dashed rgba(255,255,255,.2);border-radius:7px;
      padding:10px;font-size:.8rem;cursor:pointer;transition:all .2s}
    .btn-add-cat:hover{background:rgba(255,255,255,.12);color:#fff}

    /* ── MAIN ── */
    .main{overflow-y:auto;padding:28px}
    .empty-cat{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-cat .empty-icon{font-size:3rem;margin-bottom:12px}

    .cat-header{display:flex;align-items:flex-start;justify-content:space-between;
      margin-bottom:24px;flex-wrap:wrap;gap:14px;background:var(--surface);border-radius:var(--r);
      padding:18px 20px;border:1px solid var(--border)}
    .cat-header-main{display:flex;gap:14px;flex:1;min-width:220px}
    .cat-foto{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#f0ece6;
      flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
    .cat-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--ink);font-weight:400}
    .cat-sub{font-size:.82rem;color:var(--muted);margin-top:4px;max-width:520px}
    .cat-badge-oculto{display:inline-block;margin-left:10px;font-size:.68rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.05em;color:var(--red);background:rgba(192,57,43,.1);
      padding:2px 8px;border-radius:20px;vertical-align:middle}
    .cat-header-actions{display:flex;gap:8px;flex-shrink:0}

    .btn{border:none;border-radius:6px;padding:9px 16px;font-family:'DM Sans',sans-serif;
      font-size:.83rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;
      align-items:center;gap:6px}
    .btn-accent{background:var(--accent);color:#fff}
    .btn-accent:hover{background:#b34816}
    .btn-outline{background:none;color:var(--ink);border:1.5px solid var(--border)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-danger{background:none;color:var(--red);border:1.5px solid rgba(192,57,43,.3)}
    .btn-danger:hover{background:rgba(192,57,43,.08)}
    .btn-sm{padding:6px 12px;font-size:.76rem}

    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .item-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
      overflow:hidden;transition:box-shadow .2s;display:flex;flex-direction:column}
    .item-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.09)}
    .item-card.oculto{opacity:.55}
    .item-img-wrap{height:130px;background:#f0ece6;display:flex;align-items:center;justify-content:center;
      position:relative}
    .item-img-wrap img{width:100%;height:100%;object-fit:cover}
    .item-img-placeholder{font-size:2.2rem;opacity:.35}
    .item-oculto-tag{position:absolute;top:8px;left:8px;background:rgba(192,57,43,.92);color:#fff;
      font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
      padding:3px 8px;border-radius:20px}
    .item-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:4px}
    .item-nombre{font-weight:700;font-size:.92rem;color:var(--ink)}
    .item-desc{font-size:.78rem;color:var(--muted);line-height:1.5;flex:1}
    .item-precio-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
    .item-precio{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--earth)}
    .badge{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:20px}
    .badge-7{background:rgba(107,143,107,.15);color:var(--sage)}
    .badge-10{background:rgba(201,146,58,.15);color:var(--gold)}
    .badge-no{background:rgba(0,0,0,.06);color:var(--muted)}
    .item-actions{display:flex;gap:6px;padding:0 16px 14px}
    .item-actions .btn{flex:1;justify-content:center;padding:7px 8px}
    .btn-add-item-card{border:2px dashed var(--border);border-radius:var(--r);background:none;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      color:var(--muted);cursor:pointer;min-height:200px;font-size:.85rem;transition:all .2s}
    .btn-add-item-card:hover{border-color:var(--accent);color:var(--accent)}
    .btn-add-item-card .plus{font-size:2rem}

    /* ── MODAL ── */
    .modal-ov{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
      display:none;align-items:center;justify-content:center;padding:20px}
    .modal-ov.show{display:flex}
    .modal-box{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:88vh;
      overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .modal-head{background:var(--ink);padding:16px 22px;display:flex;align-items:center;
      justify-content:space-between;position:sticky;top:0;z-index:1;border-radius:14px 14px 0 0}
    .modal-head span{font-weight:700;color:#fff;font-size:.95rem}
    .modal-head button{background:none;border:none;color:rgba(255,255,255,.5);font-size:1.2rem;cursor:pointer}
    .modal-body{padding:20px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
    .form-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;
      font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--ink)}
    .form-input:focus{outline:none;border-color:var(--accent)}
    textarea.form-input{resize:vertical;min-height:64px}
    .form-row{display:grid;grid-template-columns:1fr 100px;gap:10px}
    .modal-actions{display:flex;gap:10px;margin-top:6px}
    .modal-actions .btn{flex:1;justify-content:center}

    .loading-overlay{position:fixed;inset:0;background:rgba(245,243,238,.7);z-index:900;
      display:none;align-items:center;justify-content:center}
    .loading-overlay.show{display:flex}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--ink);color:#fff;padding:12px 22px;border-radius:8px;font-size:.85rem;
      opacity:0;pointer-events:none;transition:all .3s;z-index:1000}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.error{background:var(--red)}
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-logo">Sanagua Lodge</span>
    <span class="header-sep">/</span>
    <span class="header-title">Mis Servicios</span>
  </div>
  <div class="header-right">
    <a href="menu-editor.html" class="btn-back">🍽️ Editor de Menú (Restaurante)</a>
    <a href="achive.html" class="btn-back">← Volver al sistema</a>
  </div>
</header>

<div class="layout">
  <!-- Sidebar: subcategorías de Servicios -->
  <div class="sidebar">
    <div class="sidebar-label">Categoría base: Servicios</div>
    <div id="sidebar-cats"></div>
    <button class="btn-add-cat" onclick="crearSubcategoria()">+ Nueva subcategoría</button>
  </div>

  <!-- Main -->
  <div class="main" id="main-content"></div>
</div>

<!-- Modal Categoría -->
<div class="modal-ov" id="modal-cat">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-cat-titulo">Editar subcategoría</span>
      <button onclick="cerrarModalCat()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Nombre</label>
        <input class="form-input" id="mc-nombre" placeholder="Ej: Pasadías"></div>
      <div class="form-group"><label>Descripción</label>
        <textarea class="form-input" id="mc-desc" placeholder="Se muestra en la página pública"></textarea></div>
      <div class="form-group"><label>URL de la foto (opcional)</label>
        <input class="form-input" id="mc-foto" placeholder="https://..."></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="cerrarModalCat()">Cancelar</button>
        <button class="btn btn-accent" onclick="guardarCategoriaModal()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Ítem -->
<div class="modal-ov" id="modal-item">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-item-titulo">Editar ítem</span>
      <button onclick="cerrarModalItem()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Nombre</label>
        <input class="form-input" id="mi-nombre" placeholder="Ej: Pasadía Adulto"></div>
      <div class="form-group"><label>Descripción</label>
        <textarea class="form-input" id="mi-desc" placeholder="Se muestra en la página pública"></textarea></div>
      <div class="form-group"><label>URL de la foto (opcional)</label>
        <input class="form-input" id="mi-foto" placeholder="https://..."></div>
      <div class="form-row">
        <div class="form-group"><label>Precio (USD)</label>
          <input class="form-input" type="number" step="0.01" min="0" id="mi-precio" placeholder="0.00"></div>
        <div class="form-group"><label>ITBMS</label>
          <select class="form-input" id="mi-itbms">
            <option value="7">7%</option>
            <option value="10">10%</option>
            <option value="0">Sin ITBMS</option>
          </select></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="cerrarModalItem()">Cancelar</button>
        <button class="btn btn-accent" onclick="guardarItemModal()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL      = 'https://cjgdlskybcaacbpnncuw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqZ2Rsc2t5YmNhYWNicG5uY3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTAwNjMsImV4cCI6MjEwMDM4NjA2M30.6UVRJBUxmLBo1ffTd7tZtfLald6Sm0qTmWi5Tx4HH98';
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let categorias = [];      // [{id,nombre,descripcion,foto,activo,productos:[...]}]
  let catActualId = null;
  let editandoItemId = null; // null = creando nuevo

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function showLoading(v){ document.getElementById('loading').classList.toggle('show', v); }
  function showToast(msg, type='success'){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    clearTimeout(t._t); t._t = setTimeout(()=>t.className='toast', 3000);
  }

  // ── Carga ────────────────────────────────────────────────────────────
  async function cargarTodo() {
    showLoading(true);
    try {
      const [{ data: cats, error: e1 }, { data: prods, error: e2 }] = await Promise.all([
        supa.from('product_categories').select('*').order('orden', { ascending: true }),
        supa.from('products').select('*').order('orden', { ascending: true }),
      ]);
      if (e1) throw e1; if (e2) throw e2;
      categorias = (cats||[]).map(c => ({ ...c, productos: (prods||[]).filter(p => p.categoria_id === c.id) }));
      if (!catActualId || !categorias.find(c=>c.id===catActualId)) catActualId = categorias[0]?.id || null;
      renderSidebar();
      renderMain();
    } catch (e) {
      console.error(e);
      showToast('❌ Error al cargar el catálogo.', 'error');
    } finally { showLoading(false); }
  }

  function renderSidebar() {
    const el = document.getElementById('sidebar-cats');
    if (!categorias.length) {
      el.innerHTML = '<p style="color:rgba(255,255,255,.4);font-size:.8rem;padding:0 20px">Sin subcategorías aún.</p>';
      return;
    }
    el.innerHTML = categorias.map(c => `
      <div class="cat-btn-wrap ${c.id===catActualId?'active':''}">
        <button class="cat-btn" onclick="seleccionarCategoria('${c.id}')">
          <span class="cat-nombre-txt">${esc(c.nombre)}</span>
          <span class="cat-count">${c.productos.length}</span>
        </button>
        <button class="cat-eye ${c.activo?'':'off'}" title="${c.activo?'Visible en la web':'Oculta en la web'}"
          onclick="toggleCategoriaActivo('${c.id}', event)">${c.activo?'👁️':'🚫'}</button>
      </div>`).join('');
  }

  function seleccionarCategoria(id) { catActualId = id; renderSidebar(); renderMain(); }

  function renderMain() {
    const main = document.getElementById('main-content');
    const cat = categorias.find(c => c.id === catActualId);
    if (!cat) {
      main.innerHTML = `<div class="empty-cat"><div class="empty-icon">🛎️</div><p>Crea tu primera subcategoría de Servicios (ej. "Pasadías").</p></div>`;
      return;
    }
    main.innerHTML = `
      <div class="cat-header">
        <div class="cat-header-main">
          <div class="cat-foto">${cat.foto ? `<img src="${esc(cat.foto)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.style.display='none'">` : '🛎️'}</div>
          <div>
            <div class="cat-name">${esc(cat.nombre)}${!cat.activo?'<span class="cat-badge-oculto">Oculta</span>':''}</div>
            <div class="cat-sub">${esc(cat.descripcion||'Sin descripción todavía.')}</div>
          </div>
        </div>
        <div class="cat-header-actions">
          <button class="btn btn-outline btn-sm" onclick="toggleCategoriaActivo('${cat.id}')">${cat.activo?'👁️ Visible':'🚫 Oculta'}</button>
          <button class="btn btn-outline btn-sm" onclick="editarCategoria('${cat.id}')">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="eliminarCategoria('${cat.id}')">🗑 Eliminar</button>
        </div>
      </div>
      <div class="items-grid" id="items-grid"></div>`;
    renderItems(cat);
  }

  function itbmsBadge(v) {
    if (v==7) return '<span class="badge badge-7">ITBMS 7%</span>';
    if (v==10) return '<span class="badge badge-10">ITBMS 10%</span>';
    return '<span class="badge badge-no">Sin ITBMS</span>';
  }

  function renderItems(cat) {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = cat.productos.map(p => `
      <div class="item-card ${p.activo?'':'oculto'}">
        <div class="item-img-wrap">
          ${p.activo?'':'<div class="item-oculto-tag">Oculto</div>'}
          ${p.foto ? `<img src="${esc(p.foto)}" onerror="this.style.display='none'">` : '<div class="item-img-placeholder">📦</div>'}
        </div>
        <div class="item-body">
          <div class="item-nombre">${esc(p.nombre)}</div>
          <div class="item-desc">${esc(p.descripcion||'')}</div>
          <div class="item-precio-row">
            <span class="item-precio">$${parseFloat(p.precio).toFixed(2)}</span>
            ${itbmsBadge(p.itbms)}
          </div>
        </div>
        <div class="item-actions">
          <button class="btn btn-outline" onclick="toggleItemActivo('${p.id}')">${p.activo?'👁️':'🚫'}</button>
          <button class="btn btn-outline" onclick="editarItem('${p.id}')">✏️ Editar</button>
          <button class="btn btn-danger" onclick="eliminarItem('${p.id}')">🗑</button>
        </div>
      </div>`).join('') + `
      <button class="btn-add-item-card" onclick="nuevoItem()">
        <span class="plus">+</span> Nuevo ítem
      </button>`;
  }

  // ── Categorías (subcategorías de Servicios) ─────────────────────────
  async function crearSubcategoria() {
    const nombre = prompt('Nombre de la nueva subcategoría (ej. "Tours guiados"):');
    if (!nombre || !nombre.trim()) return;
    try {
      const { data, error } = await supa.from('product_categories')
        .insert({ nombre: nombre.trim(), orden: categorias.length }).select().single();
      if (error) throw error;
      catActualId = data.id;
      await cargarTodo();
      showToast(`✅ Subcategoría "${nombre.trim()}" creada.`, 'success');
    } catch (e) { console.error(e); showToast('❌ Error al crear la subcategoría.', 'error'); }
  }

  function editarCategoria(id) {
    const cat = categorias.find(c => c.id === id);
    if (!cat) return;
    document.getElementById('modal-cat-titulo').textContent = 'Editar subcategoría';
    document.getElementById('mc-nombre').value = cat.nombre || '';
    document.getElementById('mc-desc').value   = cat.descripcion || '';
    document.getElementById('mc-foto').value   = cat.foto || '';
    document.getElementById('modal-cat').dataset.id = id;
    document.getElementById('modal-cat').classList.add('show');
  }
  function cerrarModalCat(){ document.getElementById('modal-cat').classList.remove('show'); }

  async function guardarCategoriaModal() {
    const id = document.getElementById('modal-cat').dataset.id;
    const nombre = document.getElementById('mc-nombre').value.trim();
    const descripcion = document.getElementById('mc-desc').value.trim();
    const foto = document.getElementById('mc-foto').value.trim();
    if (!nombre) { showToast('El nombre no puede quedar vacío.', 'error'); return; }
    try {
      const { error } = await supa.from('product_categories').update({ nombre, descripcion, foto }).eq('id', id);
      if (error) throw error;
      cerrarModalCat();
      await cargarTodo();
      showToast('✅ Subcategoría actualizada.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al guardar.', 'error'); }
  }

  async function toggleCategoriaActivo(id, ev) {
    if (ev) ev.stopPropagation();
    const cat = categorias.find(c => c.id === id);
    if (!cat) return;
    try {
      const { error } = await supa.from('product_categories').update({ activo: !cat.activo }).eq('id', id);
      if (error) throw error;
      await cargarTodo();
      showToast(cat.activo ? 'Subcategoría ocultada de la web.' : 'Subcategoría visible en la web.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al cambiar visibilidad.', 'error'); }
  }

  async function eliminarCategoria(id) {
    const cat = categorias.find(c => c.id === id);
    if (!cat) return;
    if (!confirm(`¿Eliminar "${cat.nombre}" y sus ${cat.productos.length} ítem(s)? Esta acción no se puede deshacer.`)) return;
    try {
      const { error } = await supa.from('product_categories').delete().eq('id', id);
      if (error) throw error;
      catActualId = null;
      await cargarTodo();
      showToast('Subcategoría eliminada.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al eliminar.', 'error'); }
  }

  // ── Ítems (productos) ────────────────────────────────────────────────
  function nuevoItem() {
    editandoItemId = null;
    document.getElementById('modal-item-titulo').textContent = 'Nuevo ítem';
    document.getElementById('mi-nombre').value = '';
    document.getElementById('mi-desc').value = '';
    document.getElementById('mi-foto').value = '';
    document.getElementById('mi-precio').value = '';
    document.getElementById('mi-itbms').value = '7';
    document.getElementById('modal-item').classList.add('show');
  }

  function editarItem(id) {
    const cat = categorias.find(c => c.id === catActualId);
    const p = cat?.productos.find(p => p.id === id);
    if (!p) return;
    editandoItemId = id;
    document.getElementById('modal-item-titulo').textContent = 'Editar ítem';
    document.getElementById('mi-nombre').value = p.nombre || '';
    document.getElementById('mi-desc').value = p.descripcion || '';
    document.getElementById('mi-foto').value = p.foto || '';
    document.getElementById('mi-precio').value = p.precio;
    document.getElementById('mi-itbms').value = p.itbms;
    document.getElementById('modal-item').classList.add('show');
  }
  function cerrarModalItem(){ document.getElementById('modal-item').classList.remove('show'); }

  async function guardarItemModal() {
    if (!catActualId) { showToast('Selecciona una subcategoría primero.', 'error'); return; }
    const nombre = document.getElementById('mi-nombre').value.trim();
    const descripcion = document.getElementById('mi-desc').value.trim();
    const foto = document.getElementById('mi-foto').value.trim();
    const precio = parseFloat(document.getElementById('mi-precio').value) || 0;
    const itbms = parseInt(document.getElementById('mi-itbms').value) || 0;
    if (!nombre) { showToast('Ingresa el nombre del ítem.', 'error'); return; }
    try {
      if (editandoItemId) {
        const { error } = await supa.from('products').update({ nombre, descripcion, foto, precio, itbms }).eq('id', editandoItemId);
        if (error) throw error;
      } else {
        const cat = categorias.find(c => c.id === catActualId);
        const { error } = await supa.from('products').insert({
          categoria_id: catActualId, nombre, descripcion, foto, precio, itbms, orden: cat?.productos.length || 0,
        });
        if (error) throw error;
      }
      cerrarModalItem();
      await cargarTodo();
      showToast('✅ Ítem guardado.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al guardar el ítem.', 'error'); }
  }

  async function toggleItemActivo(id) {
    const cat = categorias.find(c => c.id === catActualId);
    const p = cat?.productos.find(p => p.id === id);
    if (!p) return;
    try {
      const { error } = await supa.from('products').update({ activo: !p.activo }).eq('id', id);
      if (error) throw error;
      await cargarTodo();
      showToast(p.activo ? 'Ítem ocultado de la web.' : 'Ítem visible en la web.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al cambiar visibilidad.', 'error'); }
  }

  async function eliminarItem(id) {
    if (!confirm('¿Eliminar este ítem?')) return;
    try {
      const { error } = await supa.from('products').delete().eq('id', id);
      if (error) throw error;
      await cargarTodo();
      showToast('Ítem eliminado.', 'success');
    } catch (e) { console.error(e); showToast('❌ Error al eliminar.', 'error'); }
  }

  document.addEventListener('admin-ready', cargarTodo);
</script>
</body>
</html>
